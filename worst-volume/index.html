<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ヤスイネ.com｜Bad UI選手権</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- ゲームの外枠（サイトの一部ではない） -->
  <div id="mission">
    <button class="goal" id="missionBtn" type="button">
      <span>ミッション: <b>BAD-01 を1つだけ買う</b></span>
      <span class="next" id="missionNext">次: BAD-01 をカートに入れる</span>
    </button>
    <span class="clock" id="clock">⏱ 00:00</span>
    <button id="rankBtn" type="button" aria-label="ランキング">🏅</button>
    <button id="trophy" type="button">🏆 0/15</button>
  </div>
  <header class="shop-head" id="shopHead">
    <div class="shop-row">
      <button class="icon-btn" id="menuBtn" type="button" aria-label="メニュー">☰</button>
      <button class="logo" id="logo" type="button">ヤスイネ.com<small>公式</small></button>
      <span class="sp"></span>
      <button class="head-link" id="signupBtn" type="button">会員登録</button>
      <button class="icon-btn" id="cartBtn" type="button" aria-label="カート">🛒<span class="badge" id="cartBadge">0</span></button>
    </div>
    <form class="search" id="searchForm">
      <input type="text" id="q" placeholder="何をお探しですか？（例: 青汁）" enterkeyhint="search" autocomplete="off">
      <button type="submit" aria-label="検索">🔍</button>
    </form>
  </header>
  <main id="view"></main>
</div>
<div id="bot" hidden></div>
<div id="toast"></div>
<div id="achv"></div>
<div id="dialog"><div class="dbox" id="dialogBox"></div></div>
<script src="config.js"></script>
<script src="signup.js"></script>
<script src="site.js"></script>
</body>
</html>
